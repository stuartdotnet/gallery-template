<!-- Footer -->
<footer class="footer">
    <div class="container footer-inner">
        <p class="footer-text">&copy; {{ now.Format "2006" }} {{ .Site.Params.author | default .Site.Title }}</p>
        <div class="footer-links">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
        </div>
        <div class="footer-social">
            {{ partial "social-icons.html" (dict "social" .Site.Params.social "class" "footer-social-link" "iconOnly" true) }}
        </div>
    </div>
</footer>
