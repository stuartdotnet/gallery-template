<!-- Navigation -->
<nav class="nav" aria-label="Main navigation">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            <span class="nav-mark" aria-hidden="true">{{ .Site.Params.navCode | default "G" }}</span>
            <span>{{ .Site.Title }}</span>
        </a>
        <div class="nav-links" id="nav-links">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">
            <svg class="icon-sun" aria-hidden="true" focusable="false" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" aria-hidden="true" focusable="false" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <button class="nav-mobile-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
            <svg class="nav-hamburger-icon" width="20" height="20" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true" focusable="false">
                <rect y="2" width="18" height="2.5"/><rect y="8" width="18" height="2.5"/><rect y="14" width="18" height="2.5"/>
            </svg>
            <svg class="nav-close-icon" width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true" focusable="false">
                <line x1="2" y1="2" x2="16" y2="16"/><line x1="16" y1="2" x2="2" y2="16"/>
            </svg>
        </button>
    </div>
</nav>
