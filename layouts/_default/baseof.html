<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
    {{ partial "head.html" . }}
    <noscript><style>[data-observe]{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    {{ partial "nav.html" . }}

    <main id="main-content">
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    {{ with .Site.Params.googleAnalytics }}{{ partial "consent-banner.html" $ }}{{ end }}

    <script src="/js/scripts.js"></script>
    {{ block "scripts" . }}{{ end }}
</body>
</html>
