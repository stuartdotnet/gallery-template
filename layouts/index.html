{{ define "main" }}
    <section id="top" class="hero">
        <div class="container">
            <div class="hero-inner">
                <div class="hero-text">
                    <h1 class="hero-title">{{ .Site.Title }}</h1>
                    {{ with .Site.Params.tagline }}<p class="hero-description">{{ . }}</p>{{ end }}
                </div>
                <p class="hero-count">{{ with .Params.photos }}{{ len . }} {{ cond (eq (len .) 1) "photo" "photos" }}{{ else }}No photos yet{{ end }}</p>
            </div>
        </div>
    </section>

    <section id="gallery" class="gallery-section">
        {{ with .Content }}<div class="gallery-wide"><div class="gallery-intro">{{ . }}</div></div>{{ end }}
        {{ partial "gallery.html" . }}
    </section>
{{ end }}
